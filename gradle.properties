# Project-wide Gradle settings.
# 4 GB heap: KSP runs two annotation processors (Hilt and Room) alongside the Compose
# compiler plugin, which exceeds the 2 GB default on clean builds.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Build performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX package structure
android.useAndroidX=true

# AGP 9 ships built-in Kotlin support, but KSP is not compatible with it. Hilt and Room
# both require KSP, so we opt out and apply the standard Kotlin Gradle plugin instead.
# This is the resolution AGP's own error message prescribes.
android.builtInKotlin=false

# The Kotlin Gradle plugin cannot yet apply against AGP 9's new DSL, which is on by
# default. Required alongside builtInKotlin=false until KGP supports the new DSL.
android.newDsl=false

# Kotlin code style for this project: "official" or "obsolete"
kotlin.code.style=official

# Each library's R class contains only its own resources, keeping the R class small.
android.nonTransitiveRClass=true
